name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the interface
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet and test
        run: |
          set -o pipefail
          go vet ./...
          go test -race ./... 2>&1 | tee test.log

      # the failures as annotations, which can be read without the logs
      - name: Report what failed
        if: failure()
        run: scripts/report-test-failures.sh test.log

      - name: Build
        run: make build
